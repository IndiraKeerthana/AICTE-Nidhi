<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <!-- Outer Gold Ring -->
  <rect x="6" y="6" width="116" height="116" rx="22" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.85" />
  
  <!-- Shield Badge -->
  <path d="M64 20 L96 34 V62 C96 85 81 102 64 109 C47 102 32 85 32 62 V34 Z" 
        fill="#1e293b" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#shadow)" />
  
  <!-- AICTE Text at top of badge -->
  <text x="64" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="9" font-weight="900" fill="#93c5fd" text-anchor="middle" letter-spacing="1.5">AICTE</text>

  <!-- Central N Emblem -->
  <path d="M52 52 V82 L76 52 V82" 
        fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- NIDHI Subtitle inside badge -->
  <text x="64" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="8.5" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="1.2">NIDHI</text>
</svg>

